<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | QR code component</title>
  <style>
    /* 1. Reset & Global Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    /* 2. Layout Container */
    body {
      background-color: hsl(212, 45%, 89%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px; 
    }

    /* 3. Card Component */
    .card {
      background-color: white;
      max-width: 320px;
      width: 100%;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 4. Image Fluid */
    .card-image {
      width: 100%; 
      border-radius: 10px;
      display: block;
    }

    /* 5. Text Content */
    .card-content {
      text-align: center;
      padding: 24px 8px 12px 8px; 
    }

    .card-content h2 {
      color: hsl(218, 44%, 22%);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px; 
      line-height: 1.3;
    }

    .card-content p {
      color: hsl(220, 15%, 55%);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <main class="card">
    <img class="card-image" src="./images/image-qr-code.png" alt="QR code to Frontend Mentor">
    <div class="card-content">
      <h2>Improve your front-end skills by building projects</h2>
      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>

</body>
</html>
